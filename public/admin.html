<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>92AMZ — Painel Administrativo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 22px 35px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            width: min(1100px, 92%);
            margin: 35px auto;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 22px;
            font-size: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .stat strong {
            display: block;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .stat span {
            color: #64748b;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #b91c1c;
        }

        .mensagem {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
        }

        .sucesso {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .erro {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .noticias {
            display: grid;
            gap: 15px;
        }

        .noticia {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 18px;
        }

        .noticia h3 {
            margin-bottom: 8px;
        }

        .noticia p {
            color: #64748b;
            margin-bottom: 12px;
        }

        .noticia small {
            color: #94a3b8;
        }

        .btn-excluir {
            background: #64748b;
            margin-top: 12px;
            padding: 8px 14px;
            font-size: 13px;
        }

        .btn-excluir:hover {
            background: #475569;
        }

        .sem-noticias {
            color: #64748b;
            padding: 10px 0;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>92AMZ — Painel Administrativo</h1>
</header>

<main class="container">

    <!-- ESTATÍSTICAS -->
    <section class="grid">

        <div class="stat">
            <strong id="totalNoticias">0</strong>
            <span>Notícias publicadas</span>
        </div>

        <div class="stat">
            <strong id="totalRascunhos">0</strong>
            <span>Rascunhos</span>
        </div>

        <div class="stat">
            <strong id="totalUsuarios">0</strong>
            <span>Usuários</span>
        </div>

    </section>

    <!-- NOVA NOTÍCIA -->
    <section class="card">

        <h2>Nova notícia</h2>

        <form id="formNoticia">

            <label for="titulo">Título</label>

            <input
                type="text"
                id="titulo"
                name="titulo"
                placeholder="Título da notícia"
                required
            >

            <label for="categoria">Categoria</label>

            <select id="categoria" name="categoria">

                <option value="BRASIL">BRASIL</option>
                <option value="SANTA CATARINA">SANTA CATARINA</option>
                <option value="ITAJAÍ">ITAJAÍ</option>
                <option value="POLÍTICA">POLÍTICA</option>
                <option value="ECONOMIA">ECONOMIA</option>
                <option value="ESPORTES">ESPORTES</option>
                <option value="GERAL">GERAL</option>

            </select>

            <label for="imagem">Imagem</label>

            <input
                type="file"
                id="imagem"
                name="imagem"
                accept="image/*"
            >

            <label for="conteudo">Conteúdo</label>

            <textarea
                id="conteudo"
                name="conteudo"
                placeholder="Escreva a notícia..."
                required
            ></textarea>

            <button type="submit">
                Publicar notícia
            </button>

            <div id="mensagem" class="mensagem"></div>

        </form>

    </section>

    <!-- NOTÍCIAS -->
    <section class="card">

        <h2>Notícias publicadas</h2>

        <div id="listaNoticias" class="noticias">
            <div class="sem-noticias">
                Carregando notícias...
            </div>
        </div>

    </section>

</main>

<script>

const form = document.getElementById("formNoticia");
const mensagem = document.getElementById("mensagem");
const listaNoticias = document.getElementById("listaNoticias");


// ======================================================
// MOSTRAR MENSAGEM
// ======================================================

function mostrarMensagem(texto, tipo) {

    mensagem.textContent = texto;

    mensagem.className = "mensagem " + tipo;

    setTimeout(() => {
        mensagem.className = "mensagem";
        mensagem.textContent = "";
    }, 4000);
}


// ======================================================
// CARREGAR NOTÍCIAS
// ======================================================

async function carregarNoticias() {

    try {

        const resposta = await fetch("/api/noticias");

        if (!resposta.ok) {
            throw new Error("Erro ao carregar notícias");
        }

        const dados = await resposta.json();

        const noticias = Array.isArray(dados)
            ? dados
            : (dados.noticias || []);

        document.getElementById("totalNoticias").textContent =
            noticias.length;

        listaNoticias.innerHTML = "";

        if (noticias.length === 0) {

            listaNoticias.innerHTML = `
                <div class="sem-noticias">
                    Nenhuma notícia publicada ainda.
                </div>
            `;

            return;
        }

        noticias.forEach(noticia => {

            const div = document.createElement("div");

            div.className = "noticia";

            div.innerHTML = `
                <h3>${escapar(noticia.titulo || "Sem título")}</h3>

                <p>
                    ${escapar(
                        noticia.conteudo ||
                        noticia.content ||
                        ""
                    ).substring(0, 200)}
                </p>

                <small>
                    Categoria:
                    ${escapar(noticia.categoria || "GERAL")}
                </small>

                <br>

                <button
                    class="btn-excluir"
                    onclick="excluirNoticia('${noticia._id || noticia.id}')"
                >
                    Excluir
                </button>
            `;

            listaNoticias.appendChild(div);

        });

    } catch (erro) {

        console.error(erro);

        listaNoticias.innerHTML = `
            <div class="sem-noticias">
                Não foi possível carregar as notícias.
            </div>
        `;
    }
}


// ======================================================
// PUBLICAR NOTÍCIA
// ======================================================

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const botao = form.querySelector("button");

    botao.disabled = true;
    botao.textContent = "Publicando...";

    try {

        const dados = new FormData(form);

        const resposta = await fetch("/api/noticias", {
            method: "POST",
            body: dados
        });

        const resultado = await resposta.json();

        if (!resposta.ok || resultado.success === false) {

            throw new Error(
                resultado.message ||
                "Erro ao publicar notícia"
            );
        }

        mostrarMensagem(
            "Notícia publicada com sucesso!",
            "sucesso"
        );

        form.reset();

        carregarNoticias();

    } catch (erro) {

        console.error(erro);

        mostrarMensagem(
            erro.message || "Erro ao publicar notícia.",
            "erro"
        );

    } finally {

        botao.disabled = false;
        botao.textContent = "Publicar notícia";

    }

});


// ======================================================
// EXCLUIR NOTÍCIA
// ======================================================

async function excluirNoticia(id) {

    if (!id || id === "undefined") {

        alert("ID da notícia não encontrado.");

        return;
    }

    const confirmar = confirm(
        "Tem certeza que deseja excluir esta notícia?"
    );

    if (!confirmar) {
        return;
    }

    try {

        const resposta = await fetch(
            "/api/noticias/" + encodeURIComponent(id),
            {
                method: "DELETE"
            }
        );

        const resultado = await resposta.json();

        if (!resposta.ok || resultado.success === false) {

            throw new Error(
                resultado.message ||
                "Erro ao excluir notícia."
            );
        }

        mostrarMensagem(
            "Notícia excluída com sucesso!",
            "sucesso"
        );

        carregarNoticias();

    } catch (erro) {

        console.error(erro);

        mostrarMensagem(
            erro.message || "Erro ao excluir notícia.",
            "erro"
        );
    }
}


// ======================================================
// SEGURANÇA — ESCAPAR HTML
// ======================================================

function escapar(valor) {

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ======================================================
// INICIAR
// ======================================================

carregarNoticias();

</script>

</body>
</html>
